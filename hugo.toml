baseURL = 'https://example.org/'
locale = 'en-us'
title = 'SG Tech Pulse'

theme = "hugo-bootstrap"

disableHugoGeneratorInject = true

enableRobotsTXT = true
enableEmoji = true
#sectionPagesMenu = "main"
#googleAnalytics = "UA-1511XXXX-X"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5


[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

[params]
  [params.options]
    bootStrapJs = true
    breadCrumb = true
