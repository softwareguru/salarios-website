baseURL = 'https://salarios.sg.com.mx/'
locale = 'es-mx'
languageCode = 'es-mx'
title = 'SG Tech Pulse'

theme = "hugo-bootstrap"

disableHugoGeneratorInject = true

enableRobotsTXT = true
enableEmoji = true
#sectionPagesMenu = "main"
#googleAnalytics = "UA-1511XXXX-X"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5


[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

[params]
  # URL única de la encuesta: el partial script-tracker le propaga los UTM
  surveyURL = 'https://softwareguru.surveysparrow.com/s/encuesta-salarios-sg-2026/tt-zzExe'
  [params.options]
    bootStrapJs = true
    breadCrumb = true
